
<div class="space-y-8">
  <h2 class="text-3xl font-bold text-gray-800">ประวัติการใช้งาน (Audit Log)</h2>

  <div class="bg-white rounded-xl shadow-md">
    <div class="p-6">
      <div class="relative">
        <div class="absolute left-4 top-0 h-full w-0.5 bg-gray-200"></div>
        <ul class="space-y-8">
          @for (entry of auditLog(); track entry.id) {
            <li class="relative pl-10">
              <div class="absolute left-0 top-1.5 flex h-6 w-6 items-center justify-center rounded-full bg-indigo-500">
                <svg class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              </div>
              <div class="flex flex-col sm:flex-row justify-between items-start">
                <div>
                  <p class="font-semibold text-gray-800">{{ entry.action }} <span class="text-sm font-normal text-gray-500">by {{ entry.user }}</span></p>
                  <p class="text-sm text-gray-600">{{ entry.details }}</p>
                </div>
                <p class="text-sm text-gray-400 mt-1 sm:mt-0">{{ getFormattedTimestamp(entry.timestamp) }}</p>
              </div>
            </li>
          } @empty {
             <p class="text-center text-gray-500 py-8">ไม่มีข้อมูลประวัติการใช้งาน</p>
          }
        </ul>
      </div>
    </div>
  </div>
</div>


<div class="space-y-8">
  <h2 class="text-3xl font-bold text-gray-800">แผงควบคุมสำหรับเจ้าหน้าที่</h2>

  <div class="bg-white rounded-xl shadow-md overflow-hidden">
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">รหัสคำร้อง</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ชื่ออาคาร</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">เจ้าของ</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">วันที่ยื่นเรื่อง</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">สถานะปัจจุบัน</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">จัดการสถานะ</th>
          </tr>
        </thead>
        <tbody class="bg-white divide-y divide-gray-200">
          @for (app of sortedApplications(); track app.id) {
            <tr class="hover:bg-gray-50">
              <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ app.id }}</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">{{ app.buildingName }}</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ app.ownerName }}</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ getFormattedDate(app.submittedDate) }}</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm">
                <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full" [class]="getStatusColor(app.status)">
                  {{ app.status }}
                </span>
              </td>
              <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                 <select (change)="changeStatus(app.id, $event)" [value]="app.status" class="block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
                    <option value="ยื่นเรื่องแล้ว">ยื่นเรื่องแล้ว</option>
                    <option value="กำลังตรวจสอบ">กำลังตรวจสอบ</option>
                    <option value="อนุมัติ">อนุมัติ</option>
                    <option value="ปฏิเสธ">ปฏิเสธ</option>
                  </select>
              </td>
            </tr>
          } @empty {
             <tr>
                <td colspan="6" class="px-6 py-12 text-center text-gray-500">
                    ไม่พบข้อมูลคำร้อง
                </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>

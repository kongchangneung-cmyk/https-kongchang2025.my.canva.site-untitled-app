
<div class="space-y-8">
  <h2 class="text-3xl font-bold text-gray-800">แผนที่พิกัดอาคาร</h2>
  
  <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
    <div class="md:col-span-1 bg-white p-6 rounded-xl shadow-md">
      <h3 class="text-xl font-semibold text-gray-700 mb-4">รายการอาคาร</h3>
      <ul class="space-y-3 max-h-[60vh] overflow-y-auto">
        @for(app of applications(); track app.id) {
          <li class="p-3 border rounded-lg hover:bg-gray-50">
            <p class="font-semibold text-gray-800">{{ app.buildingName }}</p>
            <p class="text-sm text-gray-500">{{ app.address }}</p>
          </li>
        }
      </ul>
    </div>
    <div class="md:col-span-2 bg-white p-6 rounded-xl shadow-md flex items-center justify-center min-h-[60vh]">
        <div class="text-center text-gray-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="mx-auto h-24 w-24" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l5.447 2.724A1 1 0 0021 16.382V5.618a1 1 0 00-1.447-.894L15 7m-6 0l6-3m0 0l-6-3m6 3V4" /></svg>
            <p class="mt-4 text-lg font-semibold">Map View Placeholder</p>
            <p class="text-sm">ส่วนแสดงผลแผนที่จะถูกนำมาใช้ที่นี่</p>
        </div>
    </div>
  </div>
</div>
